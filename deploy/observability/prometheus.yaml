global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local-candidate

rule_files:
  - /etc/prometheus/rules/aviasurveil360.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
  - job_name: aviasurveil360-otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
